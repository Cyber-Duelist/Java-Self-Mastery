spring.application.name=bank-management-system

#Port where our server will run
server.port = 8080

#Enabling h2 - The in memory database for reducing frcition while prototyping
spring.datasource.url = jdbc:h2:mem:bankdb
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password =

#Enabling the web base h2 database console
spring.h2.console.enabled = true
spring.h2.console.path = /h2-console

#Fetching queries in terminal using hibernate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.hibernate.ddl-auto = update

